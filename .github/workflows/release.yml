---
# Publishes to RubyGems.org via Trusted Publishing (OIDC) when a v* tag is
# pushed. There is no API token or secret involved: GitHub mints a short-lived
# identity token and RubyGems.org exchanges it for a push-scoped credential.
#
# Requires a trusted publisher registered on RubyGems.org for this gem with:
#   owner       aypex-io
#   repository  spree-shipstation
#   workflow    release.yml
#   environment release
#
# rubygems/release-gem runs `bundle exec rake release`. Bundler's GemHelper
# skips tagging when the tag already exists, which it does here because the tag
# push is what triggered the run.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    # Must match the environment registered on the RubyGems trusted publisher.
    environment: release

    steps:
      - uses: actions/checkout@v6
        with:
          # release-gem installs its own git credentials for the release task.
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      # rubygems/release-gem preloads a RubyGems patch (RUBYOPT -r) that
      # activates zlib, openssl and a few other default gems before Bundler
      # starts, at the newest version installed system-wide. When the lockfile
      # pins a newer one (for example openssl), Bundler refuses to start.
      # Install the locked versions system-wide so RubyGems activates those
      # instead.
      - name: Install the locked versions of gems the release patch preloads
        run: |
          preloaded=$(ruby -e 'before = Gem.loaded_specs.keys; require "rubygems/commands/push_command"; puts Gem.loaded_specs.keys - before')
          ruby -rbundler -e '
            locked = Bundler::LockfileParser.new(File.read("Gemfile.lock")).specs.to_h { |s| [s.name, s.version] }
            ARGV.each { |name| (version = locked[name]) && puts("#{name} #{version}") }
          ' $preloaded |
          while read -r name version; do
            gem install "$name" --version "$version" --no-document
          done

      - uses: rubygems/release-gem@v1
