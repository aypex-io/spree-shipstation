---
name: Standard Rb
on:
  pull_request:
    branches:
    - '*'
  push:
    branches:
    - main
jobs:
  standard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['4.0']
    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby ${{ matrix.ruby }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run Standard Rb
      run: bundle exec standardrb --format progress
