---
name: Standard Rb
on:
  pull_request:
    branches:
    - '*'
  push:
    branches:
    - main
    - 6-0-stable
jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true
    - name: Run Standard Rb
      run: bundle exec standardrb --format progress
